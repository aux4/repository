name: Cross-Platform Test

# Proves the platform-specific `repository find` works on both macOS and Linux and
# locks in the BSD/GNU `sed -i` regression guard (see API-005). The package ships
# platform `.aux4` overrides under dist/darwin and dist/linux; pkger merges them into
# per-OS packages. This matrix builds the multi-platform package, installs the
# OS-appropriate variant, and exercises `find` against the actually-installed package
# on each runner.

on:
  push:
  pull_request:

concurrency:
  group: cross-platform-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install aux4 the same way the ecosystem's other workflows do
      # (github-actions/action/action.yml): curl installer + add to PATH.
      - name: Install aux4
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"

      - name: Install pkger
        shell: bash
        run: curl -fsSL https://pkger.aux4.sh | sh

      # Runtime dependencies of the repository commands. jq + sqlite3 are declared in
      # the package `system` array; uuid-runtime provides `uuidgen`, the id fallback
      # used by `write` when no --id is supplied.
      - name: Install system dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y jq sqlite3 uuid-runtime
          else
            brew install jq sqlite3 || true
          fi

      - name: Install aux4/test
        shell: bash
        run: |
          npm i -g jest
          aux4 aux4 pkger install aux4/test

      # (1) Build-artifact check: assert each platform zip carries the correct
      # `sed -i` variant (linux GNU `sed -i -E`, darwin BSD `sed -i '' -E`). This test
      # builds and inspects the zips, so it runs from the SOURCE tree (it invokes
      # `cd .. && pkger build`) rather than against an installed package.
      - name: Verify multi-platform build artifacts
        shell: bash
        working-directory: test
        run: aux4 test run repository__multi-platform.test.md

      # (2) Build the multi-platform package and install the meta zip. pkger picks the
      # OS-appropriate variant automatically: linux (GNU sed) on ubuntu, darwin (BSD
      # sed) on macos — so the tests below exercise the actually-built+installed
      # platform `.aux4`, not the root source.
      - name: Build and install OS-appropriate package
        shell: bash
        run: |
          rm -f ./*.zip
          aux4 aux4 pkger build .
          SCOPE=$(jq -r '.scope' .aux4)
          NAME=$(jq -r '.name' .aux4)
          VERSION=$(jq -r '.version' .aux4)
          aux4 aux4 pkger install --fromFile "${SCOPE}_${NAME}_${VERSION}.zip"
          echo "Installed variant for ${RUNNER_OS}:"
          jq -c '.platforms' "$HOME/.aux4.config/packages/${SCOPE}/${NAME}/.aux4"

      # (3) REGRESSION GUARD. Run the `find` smoke test against the INSTALLED per-OS
      # variant. This is the explicit guard: on Linux it exercises the GNU `sed -i -E`
      # form and asserts the correct `owner=...` filter result. If the BSD variant
      # were wrongly shipped for Linux (the pre-API-005 bug) this step FAILS.
      - name: Find regression guard (installed package)
        shell: bash
        run: |
          cd "$HOME/.aux4.config/packages/aux4/repository/test"
          aux4 test run repository__find-smoke.test.md

      # (4) Full runtime suite against the installed per-OS variant. The build-artifact
      # test in (1) cannot run here (no source tree to build from) so it is removed
      # from the installed copy first.
      - name: Run full runtime suite (installed package)
        shell: bash
        run: |
          TEST_DIR="$HOME/.aux4.config/packages/aux4/repository/test"
          rm -f "$TEST_DIR/repository__multi-platform.test.md"
          cd "$TEST_DIR"
          aux4 test run
