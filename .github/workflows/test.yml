name: Cross-Platform Test

# Builds the self-contained Go binary and runs the full test suite on both Linux
# and macOS. aux4/repository ships as a single statically linked binary (no
# sqlite3/jq/sed runtime dependencies and no platform-specific .aux4 overrides),
# so each runner cross-compiles the binary and exercises the same command surface
# against the local backend. The opt-in remote (Turso/libSQL) suite is a no-op
# unless TURSO_TEST_URL is set.

on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: cross-platform-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_command: "curl -fsSL https://pkger.aux4.sh | sh && aux4 builder linux"
          - os: macos-latest
            build_command: "curl -fsSL https://pkger.aux4.sh | sh && aux4 builder darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: ${{ matrix.build_command }}
