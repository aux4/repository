name: Publish Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: aux4 builder linux

  test-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: aux4 builder darwin

  # main -> prod hub, via aux4/publish-package-action@v1 (version bump + git
  # tag + GitHub release + publish). Unchanged behavior.
  publish:
    needs: [test-linux, test-darwin]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install aux4
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> $GITHUB_PATH

      - name: Build
        run: |
          aux4 build

      - name: Mint hub publish token
        id: mint
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"
      - name: Publish package
        uses: aux4/publish-package-action@v1
        with:
          working_directory: package
          package_directory: .
          level: ${{ inputs.level || 'patch' }}
          aux4_token: ${{ steps.mint.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # dev -> dev hub. aux4/publish-package-action@v1 has no registry override and
  # always tags + cuts a GitHub release, which is wrong for a dev-channel push,
  # so dev publishes directly with aux4-pkger + AUX4_REGISTRY_URL (same pattern
  # as aux4/pkger's and aux4/aux4's own dev publish jobs): version bump commit
  # only, no tag, no release.
  publish-dev:
    needs: [test-linux, test-darwin]
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install aux4
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> $GITHUB_PATH

      - name: Build
        run: aux4 build

      - name: Get current package info
        id: current
        run: |
          SCOPE=$(jq -r '.scope' package/.aux4)
          NAME=$(jq -r '.name' package/.aux4)
          CURRENT_VERSION=$(jq -r '.version' package/.aux4)
          echo "scope=${SCOPE}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.current_version }}"
          LEVEL="${{ inputs.level || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$LEVEL" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

          jq --arg v "$NEW_VERSION" '.version = $v' package/.aux4 > package/.aux4.tmp && mv package/.aux4.tmp package/.aux4

      - name: Build package
        run: cd package && aux4 aux4 pkger build .

      - name: Mint dev hub publish token
        id: devmint
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish to dev hub
        env:
          AUX4_ACCESS_TOKEN: ${{ steps.devmint.outputs.token }}
          AUX4_REGISTRY_URL: https://dev.api.hub.aux4.io/v1/packages
        run: |
          SCOPE="${{ steps.current.outputs.scope }}"
          NAME="${{ steps.current.outputs.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          cd package && aux4 aux4 pkger publish --file "${SCOPE}_${NAME}_${VERSION}.zip"

      - name: Commit the dev version
        run: |
          git add package/.aux4
          git commit -m "release: ${{ steps.version.outputs.version }} (dev hub) [skip ci]"
          git push origin dev